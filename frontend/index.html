<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrape | Railcode</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Pin a saved theme before first paint, so a user whose choice differs
      // from their OS doesn't get a flash of the other one. No saved value
      // means "follow the OS", which the stylesheet already does unaided.
      try {
        var t = localStorage.getItem('scrape.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The platform chrome (launcher / log-out bar). Keep it. -->
    <script src="/_api/chrome.js"></script>
  </body>
</html>
